# .github/workflows/ci.yml
# 基础 CI：每次 push / PR 自动跑质量检查 + 构建
#
# 文件名随意，但放在 .github/workflows/ 下才会被 GitHub 识别
# 一个 repo 可以有多个 workflow 文件（彼此独立）

name: CI

# ===== 触发条件 =====
# push：推送到指定分支时
# pull_request：有 PR 创建/更新且 target 这些分支时
on:
  push:
    branches:
      - main
      - 'feat/**'  # 通配：feat/ci-cd、feat/anything 都触发
  pull_request:
    branches:
      - main

# ===== 任务列表 =====
jobs:
  # job ID 自定义，下游 needs 引用要用它
  quality-check:
    # 在 GitHub 提供的 Ubuntu 虚拟机上跑（免费）
    runs-on: ubuntu-latest

    # 每一步都按顺序执行
    steps:
      # 1) 拉代码：actions/checkout 是官方 action，几乎所有 workflow 都要第一步执行
      #    @v4 指定大版本，避免未来某次升级破坏 workflow
      - name: 拉取代码
        uses: actions/checkout@v4

      # 2) 安装 Node：actions/setup-node 帮你装好 Node 并加到 PATH
      #    cache: 'npm' 启用 npm 下载缓存：
      #      key 由 hashFiles('package-lock.json') 自动计算
      #      lock 文件不变 → 缓存命中 → 跳过几乎所有下载，install 从 60s → 10s
      #      lock 文件变了 → 自动重算 key → 重新下载 + 重新写缓存
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3) 安装依赖
      #    `npm ci`（clean install）：严格按 package-lock.json 装，干净、可重现
      #    legacy-peer-deps 已在 .npmrc 里配置，不再走 CLI flag（避免 npm 10 偶发的
      #    "Exit handler never called!" 崩溃 bug）
      #
      #    set -euo pipefail：
      #      -e 命令失败即退出；-u 引用未定义变量即退出；-o pipefail 管道任一失败即整体失败
      #      防御 npm 自身 exit 0 但实际崩了的情况
      #    重试 3 次：CI 上偶发网络抖动是家常便饭，retry 是必备
      - name: 安装依赖
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            echo "[install] attempt $i"
            if npm ci --no-audit --no-fund; then
              echo "[install] success"
              break
            fi
            echo "[install] failed, retrying..."
            rm -rf node_modules
            sleep 5
            if [ "$i" = "3" ]; then
              echo "[install] all 3 attempts failed"
              exit 1
            fi
          done

      # 诊断：兜底验证 node_modules 真的装上了
      # 如果这一步失败，说明上一步是"假成功"，立刻中断 CI 避免误导
      - name: 验证依赖已安装
        run: |
          set -e
          if [ ! -d node_modules ]; then
            echo "::error::node_modules 不存在，安装实际上失败了"
            exit 1
          fi
          if [ ! -x node_modules/.bin/eslint ]; then
            echo "::error::eslint 未被链入 .bin，安装不完整"
            ls -la node_modules/.bin/ | head -30
            exit 1
          fi
          echo "✅ 依赖完整"
          ls -la node_modules/.bin/ | grep -E 'eslint|prettier|webpack|tsc'

      # 失败时把 npm debug log 当 artifact 上传，方便事后排查
      - name: 失败时上传 npm 日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: npm-debug-log
          path: ~/.npm/_logs/
          if-no-files-found: ignore

      # 4) 代码风格检查
      - name: ESLint
        run: npm run lint

      # 5) 类型检查
      - name: TypeScript
        run: npm run typecheck

      # 6) 生产构建
      #    任何一步失败，后续就不会执行（fail-fast）
      - name: 构建
        run: npm run build
