# .github/workflows/ci.yml
# 基础 CI：每次 push / PR 自动跑质量检查 + 构建
#
# 文件名随意，但放在 .github/workflows/ 下才会被 GitHub 识别
# 一个 repo 可以有多个 workflow 文件（彼此独立）

name: CI

# ===== 触发条件 =====
# push：推送到指定分支时
# pull_request：有 PR 创建/更新且 target 这些分支时
on:
  push:
    branches:
      - main
      - 'feat/**'  # 通配：feat/ci-cd、feat/anything 都触发
  pull_request:
    branches:
      - main

# ===== 任务列表 =====
jobs:
  # job ID 自定义，下游 needs 引用要用它
  quality-check:
    # name 字段会显示在 GitHub Actions 列表里，带上 node 版本一眼能看出哪个版本挂了
    name: 质量检查 (Node ${{ matrix.node }})

    # 在 GitHub 提供的 Ubuntu 虚拟机上跑（免费）
    runs-on: ubuntu-latest

    # job 总超时 15 分钟（默认 360 分钟太长，卡死要等 6 小时）
    timeout-minutes: 15

    # ===== 矩阵构建 =====
    # matrix 会自动把这个 job 展开成多个并行 job，每个用不同的变量值
    # 这里：node 18/20/22 三个版本并行跑同一套检查
    #
    # fail-fast: false → 任一失败，其他继续跑完，方便看全貌
    # fail-fast: true（默认）→ 一个挂了全部取消，节省资源但定位慢
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]

    # CI 环境变量：跳过 husky 安装（npm install 会触发 prepare，CI 上不需要 hooks）
    env:
      HUSKY: 0

    # 每一步都按顺序执行
    steps:
      # 1) 拉代码：actions/checkout 是官方 action，几乎所有 workflow 都要第一步执行
      #    @v4 指定大版本，避免未来某次升级破坏 workflow
      - name: 拉取代码
        uses: actions/checkout@v4

      # 2) 安装 Node：actions/setup-node 帮你装好 Node 并加到 PATH
      #    cache: 'npm' 启用 npm 下载缓存：
      #      key 由 hashFiles('package-lock.json') 自动计算
      #      lock 文件不变 → 缓存命中 → 跳过几乎所有下载，install 从 60s → 10s
      #      lock 文件变了 → 自动重算 key → 重新下载 + 重新写缓存
      - name: 安装 Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      # 3) 安装依赖
      #    用 `npm ci`：严格按 lock 装，可重现，CI 必备
      #    legacy-peer-deps / fetch-retries 都已在 .npmrc 里配置
      #    timeout-minutes: 5 是关键 —— 5 分钟装不完直接挂，再也不卡死
      #    （上次卡死就是因为没设 timeout，叠加 npm 的 keepalive bug）
      - name: 安装依赖
        timeout-minutes: 5
        run: npm ci

      # 兜底验证：防御 npm "假成功"（Exit handler never called! bug）
      # 显式断言 node_modules 和关键 .bin 工具真的在
      - name: 验证依赖已安装
        run: |
          set -e
          test -d node_modules || { echo "::error::node_modules 不存在，安装失败"; exit 1; }
          test -x node_modules/.bin/eslint || { echo "::error::eslint 未装好"; exit 1; }
          test -x node_modules/.bin/webpack || { echo "::error::webpack 未装好"; exit 1; }
          echo "✅ 依赖完整"

      # 失败时把 npm debug log 当 artifact 上传，方便事后排查
      - name: 失败时上传 npm 日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: npm-debug-log
          path: ~/.npm/_logs/
          if-no-files-found: ignore

      # 4) 代码风格检查
      - name: ESLint
        run: npm run lint

      # 5) 类型检查
      - name: TypeScript
        run: npm run typecheck

      # 6) 生产构建
      #    任何一步失败，后续就不会执行（fail-fast）
      - name: 构建
        run: npm run build
