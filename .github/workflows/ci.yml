# .github/workflows/ci.yml
# 基础 CI：每次 push / PR 自动跑质量检查 + 构建
#
# 文件名随意，但放在 .github/workflows/ 下才会被 GitHub 识别
# 一个 repo 可以有多个 workflow 文件（彼此独立）

name: CI

# ===== 触发条件 =====
# push：推送到指定分支时
# pull_request：有 PR 创建/更新且 target 这些分支时
on:
  push:
    branches:
      - main
      - 'feat/**'  # 通配：feat/ci-cd、feat/anything 都触发
  pull_request:
    branches:
      - main

# ===== 任务列表 =====
jobs:
  # job ID 自定义，下游 needs 引用要用它
  quality-check:
    # name 字段会显示在 GitHub Actions 列表里，带上 node 版本一眼能看出哪个版本挂了
    name: 质量检查 (Node ${{ matrix.node }})

    # 在 GitHub 提供的 Ubuntu 虚拟机上跑（免费）
    runs-on: ubuntu-latest

    # job 总超时 15 分钟（默认 360 分钟太长，卡死要等 6 小时）
    timeout-minutes: 15

    # ===== 矩阵构建 =====
    # matrix 会自动把这个 job 展开成多个并行 job，每个用不同的变量值
    # 这里：node 18/20/22 三个版本并行跑同一套检查
    #
    # fail-fast: false → 任一失败，其他继续跑完，方便看全貌
    # fail-fast: true（默认）→ 一个挂了全部取消，节省资源但定位慢
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]

    # CI 环境变量：跳过 husky 安装（npm install 会触发 prepare，CI 上不需要 hooks）
    env:
      HUSKY: 0

    # 每一步都按顺序执行
    steps:
      # 1) 拉代码：actions/checkout 是官方 action，几乎所有 workflow 都要第一步执行
      #    @v4 指定大版本，避免未来某次升级破坏 workflow
      - name: 拉取代码
        uses: actions/checkout@v4

      # 2) 安装 Node：actions/setup-node 帮你装好 Node 并加到 PATH
      #    不再用 cache: 'npm' —— 缓存交给下一步的 bahmutov/npm-install
      #    （两者都用 actions/cache，同时启用会冲突）
      - name: 安装 Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 3) 安装依赖 —— 用社区成熟 action 替代手写 npm ci
      #
      # 为什么不直接 `npm ci`？
      #   GitHub runner 上 npm 进程偶发挂起是已知问题（runner-images#6698、#3737）
      #   原因是 npm 拉 tarball 时 socket keep-alive 不返回，自身 fetch-timeout 救不回来
      #   我们之前手写 bash for 重试也不行 —— bash 杀不掉挂起的子进程
      #
      # bahmutov/npm-install 干了什么：
      #   1. 自动用 actions/cache 缓存 node_modules（key = hashFiles(lock)）
      #   2. 缓存命中：直接复用，跳过 install
      #   3. 缓存未命中：跑 npm ci，失败自动重试
      #   4. 内部处理了进程超时和强杀，比 bash for 更可靠
      #
      # 注意：这个 action 缓存的是 node_modules 而不是 ~/.npm，命中后省下"解压+链接"环节
      # 所以前面的 setup-node 不需要再写 cache: 'npm'（删掉避免冲突）
      - name: 安装依赖
        timeout-minutes: 8
        uses: bahmutov/npm-install@v1
        with:
          useLockFile: true     # 走 npm ci 而不是 npm install，保证可重现

      # 兜底验证：防御 npm "假成功"（Exit handler never called! bug）
      - name: 验证依赖已安装
        run: |
          set -e
          test -d node_modules || { echo "::error::node_modules 不存在，安装失败"; exit 1; }
          test -x node_modules/.bin/eslint || { echo "::error::eslint 未装好"; exit 1; }
          test -x node_modules/.bin/webpack || { echo "::error::webpack 未装好"; exit 1; }
          echo "✅ 依赖完整"

      # 失败时把 npm debug log 当 artifact 上传，方便事后排查
      - name: 失败时上传 npm 日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: npm-debug-log
          path: ~/.npm/_logs/
          if-no-files-found: ignore

      # 4) 代码风格检查
      - name: ESLint
        run: npm run lint

      # 5) 类型检查
      - name: TypeScript
        run: npm run typecheck

      # 6) 生产构建
      #    任何一步失败，后续就不会执行（fail-fast）
      - name: 构建
        run: npm run build
